services:
  db:
    image: postgres:17-alpine
    container_name: autohous-revenue-db
    environment:
      POSTGRES_USER: revenue
      POSTGRES_PASSWORD: revenue
      POSTGRES_DB: autohous_revenue
    ports:
      - "5433:5432"
    volumes:
      - revenue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenue -d autohous_revenue"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  revenue_pgdata:
